# OpenGZH NAVAL ADDITION (hand-written, not converted from the original data).
#
# GLA ships, built at the GLA Shipyard (rules/gla/shipyards.yaml). In GLA style these are armed
# civilian boats: the fishing trawler (model CVTROWLER) and the junk (model CVJUNK).
# Weapons are the GLA's own (Quad Cannon, the car bomb).

Objects:
  # Armed trawler: a Quad Cannon bolted to a fishing trawler; hits boats and aircraft.
  GLAShipArmedTrawler:
    ReskinOf: BoatFishingTrowler
    DisplayName: OBJECT:GLAShipArmedTrawler
    Side: GLA
    BuildCost: 600
    BuildTime: 10.0
    VisionRange: 250
    ShroudClearingRange: 300
    TransportSlotCount: 0
    RadarPriority: UNIT
    ExperienceValue: 50 50 100 150
    ExperienceRequired: 0 100 200 400
    IsTrainable: Yes
    CommandSet: GLAShipCommandSet
    KindOf: PRELOAD SELECTABLE CAN_ATTACK VEHICLE BOAT SCORE
    Locomotor: SET_NORMAL NavalLightLocomotor
    Prerequisites:
      Object: GLAShipyard Demo_GLAShipyard Slth_GLAShipyard Chem_GLAShipyard
    WeaponSet:
      Conditions: None
      Weapon: [PRIMARY QuadCannonGun, SECONDARY QuadCannonGunAir]
      PreferredAgainst: [PRIMARY INFANTRY VEHICLE STRUCTURE, SECONDARY AIRCRAFT]
    ArmorSet:
      Conditions: None
      Armor: NavalArmor
      DamageFX: TankDamageFX
    Modules:
      ModuleTag_02:
        Module: Body
        Class: ActiveBody
        MaxHealth: 350.0
        InitialHealth: 350.0
      ModuleTag_Naval_AI:
        Module: Behavior
        Class: AIUpdateInterface
        AutoAcquireEnemiesWhenIdle: Yes

  # Bomb boat: an old junk packed with explosives; rams its target and blows up, like a bomb truck.
  GLAShipBombBoat:
    ReskinOf: BoatAsianFishing
    DisplayName: OBJECT:GLAShipBombBoat
    Side: GLA
    BuildCost: 700
    BuildTime: 12.0
    VisionRange: 200
    ShroudClearingRange: 250
    TransportSlotCount: 0
    RadarPriority: UNIT
    CommandSet: GLAShipCommandSet
    KindOf: PRELOAD SELECTABLE CAN_ATTACK VEHICLE BOAT SCORE
    Locomotor: SET_NORMAL NavalLightLocomotor
    Prerequisites:
      Object: GLAShipyard Demo_GLAShipyard Slth_GLAShipyard Chem_GLAShipyard
    WeaponSet:
      Conditions: None
      Weapon: PRIMARY SuicideCarBomb
    ArmorSet:
      Conditions: None
      Armor: NavalArmor
      DamageFX: TankDamageFX
    Modules:
      ModuleTag_02:
        Module: Body
        Class: ActiveBody
        MaxHealth: 250.0
        InitialHealth: 250.0
