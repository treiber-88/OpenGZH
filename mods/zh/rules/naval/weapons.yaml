# OpenGZH NAVAL ADDITION (hand-written, not converted from the original data).
# Shared by the ships of every faction (rules/<faction>/ships.yaml).

Weapons:
  # The original battleship gun is a cinematic weapon (20000 range, 4 shots a second);
  # this is the playable version: long-range artillery that can't hit close targets.
  NavalBattleshipGun:
    PrimaryDamage: 150.0
    PrimaryDamageRadius: 30.0
    ScatterRadius: 20.0
    ScatterRadiusVsInfantry: 20.0
    AttackRange: 450.0
    MinimumAttackRange: 100.0
    MinTargetPitch: 15
    MaxTargetPitch: 80
    DamageType: EXPLOSION
    DeathType: EXPLODED
    WeaponSpeed: 400
    WeaponRecoil: 5
    ProjectileObject: GenericTankShell
    FireFX: WeaponFX_BattleshipBogusGun
    FireSound: BattleshipWeapon
    ProjectileDetonationFX: FX_StrategyCenterBarrage
    RadiusDamageAffects: ALLIES ENEMIES NEUTRALS
    DelayBetweenShots: 4000
    ClipSize: 0
    ClipReloadTime: 0
    ProjectileCollidesWith: STRUCTURES

  # Deck gun of a patrol boat: the original PT boat gun with a little more range.
  NavalPatrolGun:
    PrimaryDamage: 30.0
    PrimaryDamageRadius: 0.0
    AttackRange: 160.0
    DamageType: SMALL_ARMS
    DeathType: NORMAL
    WeaponSpeed: 999999.0
    FireFX: WeaponFX_TechnicalGunFire
    FireSound: TechnicalWeapon
    RadiusDamageAffects: ALLIES ENEMIES NEUTRALS
    DelayBetweenShots: 500
    AntiAirborneVehicle: No
    AntiGround: Yes
